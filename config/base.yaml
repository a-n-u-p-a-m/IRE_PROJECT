# base.yaml — Shared configuration (all team members must use identical values)

# Corpus and queries
corpus: msmarco_passage_v1          # 8.8M passages
eval_query_sets: [dl19, dl20]       # TREC-DL 2019 (43q) + 2020 (54q)
dev_query_set: dev_small            # MS MARCO dev (6980q, for sanity checks)

# Stage 1 → Stage 2 boundary
candidate_set_k: 1000               # Top-K from Stage 1 to pass to reranker
candidate_set_k_ablation: [100, 500, 1000]  # For experiment E6

# Reranker (Stage 2)
reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-12-v2
  max_length: 512
  batch_size: 64

# Extension reranker (E7 only)
extension_reranker:
  model_name: castorini/monot5-base-msmarco
  max_length: 512
  batch_size: 32

# Evaluation
eval_top_k: 10                      # nDCG@10, attribution for top-10 docs
bootstrap_iterations: 1000
bootstrap_ci: 0.95

# Reproducibility
seed: 42
intervention_seeds: [42, 123, 456]

# Paths
data_dir: data
results_dir: results
